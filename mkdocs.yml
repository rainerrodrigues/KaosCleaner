site_name: kaos-cleaner
site_description: High-throughput CSV cleaning for Python, powered by a compiled Julia engine
site_url: https://rainerrodrigues.github.io/KaosCleaner/
repo_url: https://github.com/rainerrodrigues/KaosCleaner
repo_name: rainerrodrigues/KaosCleaner
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Cleaning options: options.md
  - Large files: large-files.md
  - Logging: logging.md
  - How it works: how-it-works.md
  - Benchmarks: benchmarks.md
  - API reference: api.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]  # read statically from the source; no engine needed
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
