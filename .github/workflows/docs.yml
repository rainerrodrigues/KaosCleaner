name: Docs

# Builds the MkDocs site and publishes it to GitHub Pages. Needs Settings →
# Pages → Source: "GitHub Actions" once. The API reference is read straight
# from python/kaos_cleaner's docstrings, so no engine build is involved.
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, CHANGELOG.md, python/kaos_cleaner/**, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, CHANGELOG.md, python/kaos_cleaner/**, .github/workflows/docs.yml]
  # The release bot's CHANGELOG commit is pushed with GITHUB_TOKEN, which does
  # not trigger workflows; rebuild after each release run instead.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull request builds are grouped per branch, so pushing to a PR never
# cancels a deploy from main; a newer main run replaces an older one.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the site (strict, so broken links and references fail)
        run: |
          python -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' # PRs only check that the site builds
    runs-on: ubuntu-latest
    # A deploy that has started is never cut off halfway
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
