name: CI

# Checks every pull request before it can reach main (and so a release):
# Julia tests, a Linux build of libkaoscleaner, then the Python bridge tests
# and the speed gate against pandas, all on the same runner.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: python -m pip install ruff==0.17.4 mypy==2.4.1 polars

      - name: ruff (lint and format)
        run: |
          ruff check python/ scripts/
          ruff format --check python/ scripts/

      - name: mypy
        working-directory: python
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6' # exactly the Julia version Manifest.toml was resolved with

      - uses: julia-actions/cache@v2

      - name: Julia tests
        run: julia --project=. -e "using Pkg; Pkg.instantiate(); Pkg.test()"

      - name: Compile libkaoscleaner
        run: julia build.jl

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install pyarrow polars cffi pytest pytest-benchmark pandas trove-classifiers

      - name: Bridge tests and benchmarks
        run: >
          python -m pytest python/tests -v -p no:cacheprovider
          --benchmark-columns=min,mean,stddev --benchmark-json=benchmark.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
          if-no-files-found: ignore
