name: TagBot

# Tags each Julia version after it has been registered in General. The Julia
# package is a subdirectory package, so its tags are KaosCleaner-vX.Y.Z,
# separate from the vX.Y.Z tags semantic-release creates for the Python
# package (see build_wheel.yml and releaserc.toml).
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: '3'

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: julia/KaosCleaner.jl
